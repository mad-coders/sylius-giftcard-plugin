madcoders_sylius_gift_card:
    cart_item:
        amount:
            not_a_preset: Wybierz jedną z dostępnych kwot.
            out_of_range: Kwota musi mieścić się między {{ minimum }} a {{ maximum }}.
            required: Wybierz, na jaką kwotę ma opiewać karta podarunkowa.
        gift_card_not_sold_in_channel: Karty podarunkowe nie są sprzedawane w tym kanale.
        message:
            too_long: Wiadomość jest za długa - zmieść się w {{ limit }} znakach.
    gift_card:
        amount:
            positive: Kwota musi być większa od zera.
        code:
            not_blank: Wpisz kod karty podarunkowej.
            unique: Karta podarunkowa o tym kodzie już istnieje.
        expires_at:
            not_blank: Podaj datę wygaśnięcia karty podarunkowej.
            not_in_the_past: Data wygaśnięcia nie może być z przeszłości - pozostałe
                środki stałyby się niemożliwe do wykorzystania i nigdzie nie zostałoby
                to odnotowane. Aby wycofać tę kartę z obiegu, wyzeruj jej saldo.
        initial_amount:
            not_blank: Podaj wartość karty podarunkowej.
            positive: Kwota musi być większa od zera.
    gift_card_configuration:
        amount_presets:
            invalid: Podaj kwoty oddzielone przecinkami, na przykład "25, 50, 100".
            required: Ten tryb udostępnia gotowe kwoty, więc trzeba podać co najmniej
                jedną.
        bounds:
            inverted: Największa kwota nie może być mniejsza od najmniejszej.
            required: W tym trybie klient wpisuje kwotę, więc trzeba podać zarówno
                najmniejszą, jak i największą.
        code_length:
            too_short: Długość kodu musi wynosić co najmniej 12 znaków - krótszy kod
                da się odgadnąć.
        validity_period:
            not_blank: Podaj, jak długo nowa karta pozostaje ważna, na przykład "1 year".
            unparseable: To nie jest okres, który sklep rozumie. Użyj wyrażenia względnego,
                na przykład "1 year", "18 months" albo "30 days".
    order:
        gift_card_cannot_pay_for_gift_card: Kartą podarunkową nie można zapłacić za
            kartę podarunkową. Usuń kartę podarunkową z koszyka albo zrezygnuj z płatności
            kartą, aby kontynuować.
        gift_card_not_sold_in_channel: Twój koszyk zawiera kartę podarunkową, a karty podarunkowe
            nie są sprzedawane w tym kanale. Usuń ją, aby kontynuować.
