madcoders_sylius_gift_card:
    ui:
        gift_card: Gift card
        gift_cards: Gift cards
        gift_card_configurations: Gift card configuration
        gift_card_code: Gift card code
        enter_gift_card_code: Enter your gift card code
        apply_gift_card: Apply
        remove: Remove
        amount_to_pay: Left to pay
        remaining_balance: Remaining balance
        initial_amount: Initial amount
        amount: Amount
        expires_at: Expires at
        expires_at_help: Pre-filled from the channel's validity period. Change it if this card should last a different length of time; it cannot be left empty.
        # Only reachable on a card written before the mandatory-expiry migration ran. Shown rather
        # than a fabricated date, which is what an unguarded `date` filter produces from null.
        expires_at_not_recorded: Not recorded
        code: Code
        code_help: Leave empty to generate one from the channel's configuration.
        code_immutable_help: A code cannot be changed once the card is issued - the customer already has it, and orders paid with the card are linked to it.
        code_prefix: Code prefix
        code_prefix_help: Prepended to every generated code, for example "GIFT-".
        code_length: Code length
        code_length_help: 'Number of random characters after the prefix. Minimum 12 - a shorter code is guessable, and a gift card code is money.'
        validity_period: Validity period
        validity_period_help: 'How long a new card stays valid, for example "1 year" or "18 months". Required - every gift card expires.'
        tender_mode: What a gift card pays for
        tender_mode_help: Whether a gift card may be spent on another gift card. Allowing it lets a holder roll one card into the next indefinitely, which makes the expiry date unenforceable.
        tender_mode_choice:
            goods_only: Everything except gift cards
            anything: Anything, gift cards included
        sale_mode: Gift card sales
        sale_mode_help: Whether customers can buy gift cards in this channel. Cards already issued can always be redeemed, whichever you choose.
        sale_mode_choice:
            sellable: Sold in the shop
            admin_only: Issued by an administrator only
        custom_message: Custom message
        amount_mode: How the amount is chosen
        amount_mode_help: Whether a customer buying a gift card in this channel pays the product's price or picks the amount themselves.
        amount_presets: Preset amounts
        amount_presets_help: 'The amounts offered as ready-made choices, separated by commas, in this channel''s currency - for example "25, 50, 100". Used by the preset modes.'
        minimum_amount: Smallest amount
        minimum_amount_help: The least a customer may type in. Used by the free-amount modes. Preset amounts are offered whether or not they fall inside it.
        maximum_amount: Largest amount
        maximum_amount_help: The most a customer may type in. Used by the free-amount modes. Preset amounts are offered whether or not they fall inside it.
        choose_amount: Choose an amount
        other_amount: Other amount
        amount_between: 'Type anything between %minimum% and %maximum%.'
        gift_card_message: Message
        gift_card_message_help: 'Optional. Up to %limit% characters, shown with the code when it is delivered.'
        purchaser: Bought by
        redeemer: Used by
        adjust_balance: Adjust balance
        adjustment_direction: Direction
        add_to_balance: Add to balance
        take_from_balance: Take from balance
        balance_after: Balance after
        transactions: Balance history
        no_transactions: This gift card has not been used yet.
        is_gift_card: This product is a gift card
        is_gift_card_help: Buying it issues a gift card per unit, worth what was paid for that unit.
        transaction_type:
            debit: Spent
            credit: Added
        amount_mode.fixed: The product's price
        amount_mode.presets: A list of preset amounts
        amount_mode.range: Any amount within a range
        amount_mode.presets_and_range: Preset amounts, or any amount within a range
        my_gift_cards: My gift cards
        gift_cards_i_use: Gift cards I use
        gift_cards_i_bought: Gift cards I bought
        no_gift_cards_used: You are not using any gift cards yet.
        no_gift_cards_bought: You have not bought any gift cards.
        balance_history: Balance history
    emails:
        gift_cards_purchased:
            subject: Your gift cards
            heading: Your gift cards are ready
            intro: 'Thank you for your purchase. Your gift card codes are below.'
            how_to_use: Enter the code in your cart to spend it. You can follow the remaining balance in your account.
    menu:
        admin:
            gift_cards: Gift cards
            gift_card_configuration: Gift card configuration
        shop:
            account:
                gift_cards: My gift cards
