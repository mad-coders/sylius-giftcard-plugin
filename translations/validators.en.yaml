# Validation messages. Symfony translates constraint violations in the `validators` domain, not
# `messages`, so a key put in the wrong catalogue reaches the user as the key itself.
#
# Messages the plugin hands to a FormError itself - the gift card configuration's cross-field rules -
# live here too and are translated from this domain explicitly, so there is one catalogue for
# validation rather than two. See ai/coding-rules.md.
madcoders_sylius_gift_card:
    cart_item:
        gift_card_not_sold_in_channel: Gift cards are not sold in this channel.
        amount:
            required: Please choose how much this gift card should be worth.
            not_a_preset: Please choose one of the available amounts.
            out_of_range: 'The amount must be between {{ minimum }} and {{ maximum }}.'
        message:
            too_long: 'Your message is too long - please keep it to {{ limit }} characters or fewer.'
    order:
        gift_card_not_sold_in_channel: Your cart contains a gift card, and gift cards are not sold in this channel. Please remove it to continue.
        gift_card_cannot_pay_for_gift_card: A gift card cannot be used to pay for a gift card. Remove the gift card from your basket, or remove the gift card payment, to continue.
    gift_card:
        code:
            not_blank: Please enter a gift card code.
            unique: A gift card with this code already exists.
        initial_amount:
            not_blank: Please enter the amount the gift card is worth.
            positive: The amount must be greater than zero.
        amount:
            positive: The amount must be greater than zero.
        expires_at:
            not_blank: Please enter the date this gift card expires.
    gift_card_configuration:
        amount_presets:
            invalid: 'Enter the preset amounts separated by commas, for example "25, 50, 100".'
            required: This mode offers preset amounts, so at least one has to be set.
        bounds:
            required: This mode lets the customer type an amount, so both the smallest and the largest have to be set.
            inverted: The largest amount cannot be smaller than the smallest one.
        code_length:
            too_short: 'The code length must be at least 12 characters - a shorter code is guessable.'
        validity_period:
            not_blank: Please enter how long a new gift card stays valid, for example "1 year".
            unparseable: 'This is not a period the shop understands. Use a relative expression such as "1 year", "18 months" or "30 days".'
