sylius_twig_hooks:
    hooks:
        # Sylius' CRUD show template renders the hook chain under `sylius_admin.<resource_name>`,
        # falling back to `sylius_admin.common`. Hookables from both prefixes are merged, so these
        # are added to the standard show page rather than replacing it.
        #
        # The ledger is the answer to "why is there only this much left on it" - the question an
        # admin gets from a customer holding the card.
        'sylius_admin.gift_card.show.content':
            madcoders_gift_card_details:
                template: '@MadcodersSyliusGiftCardPlugin/admin/gift_card/show/details.html.twig'
                priority: 50
            madcoders_gift_card_transactions:
                template: '@MadcodersSyliusGiftCardPlugin/admin/gift_card/show/transactions.html.twig'
                priority: 40

        # The gift card flag on the product form, for both create and update. Sylius' product form
        # renders only what a hookable emits (`render_rest: false`), and the field is mapped - so
        # without these the checkbox is invisible AND every product save submits it as absent,
        # which Symfony maps to false and silently un-flags the product.
        'sylius_admin.product.create.content.form.sections.general':
            madcoders_gift_card:
                template: '@MadcodersSyliusGiftCardPlugin/admin/product/form/sections/general/gift_card.html.twig'
                priority: 350

        'sylius_admin.product.update.content.form.sections.general':
            madcoders_gift_card:
                template: '@MadcodersSyliusGiftCardPlugin/admin/product/form/sections/general/gift_card.html.twig'
                priority: 350
