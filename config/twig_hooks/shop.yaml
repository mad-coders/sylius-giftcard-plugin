sylius_twig_hooks:
    hooks:
        # Rendered between the cart form (priority 100) and the suggested products (0), which puts
        # it *outside* Sylius' cart <form> - the gift card panel posts its own form, and nesting
        # one form inside another is invalid HTML.
        'sylius_shop.cart.index.content':
            madcoders_gift_card:
                template: '@MadcodersSyliusGiftCardPlugin/shop/cart/gift_card.html.twig'
                priority: 50

        # A summary line showing what the applied cards take off the total.
        'sylius_shop.cart.index.content.form.sections.general.summary':
            madcoders_gift_card_total:
                template: '@MadcodersSyliusGiftCardPlugin/shop/cart/summary/gift_card_total.html.twig'
                # Below the order total (100), so "you pay" reads after the total it modifies.
                priority: 50

        # Account pages. The prefix is merged with `sylius_shop.account.common`, so the account
        # breadcrumbs and menu still render around this content.
        'madcoders_sylius_gift_card.account.gift_card_index.index.content.main':
            gift_cards:
                template: '@MadcodersSyliusGiftCardPlugin/shop/account/gift_card/index/main.html.twig'
                priority: 0

        'madcoders_sylius_gift_card.account.gift_card_show.index.content.main':
            gift_card:
                template: '@MadcodersSyliusGiftCardPlugin/shop/account/gift_card/show/main.html.twig'
                priority: 0
