sylius_twig_hooks:
    hooks:
        # The amount and the message, inside Sylius' own add-to-cart form. Priority 150 puts them
        # between the variant table (200) and the quantity (100): the customer decides what the card
        # is worth before deciding how many to buy.
        'sylius_shop.product.show.content.info.summary.add_to_cart':
            madcoders_gift_card_fields:
                template: '@MadcodersSyliusGiftCardPlugin/shop/product/add_to_cart/gift_card.html.twig'
                priority: 150

        # Rendered between the cart form (priority 100) and the suggested products (0), which puts
        # it *outside* Sylius' cart <form> - the gift card panel posts its own form, and nesting
        # one form inside another is invalid HTML.
        'sylius_shop.cart.index.content':
            madcoders_gift_card:
                template: '@MadcodersSyliusGiftCardPlugin/shop/cart/gift_card.html.twig'
                priority: 50

        # A summary line showing what the applied cards take off the total.
        'sylius_shop.cart.index.content.form.sections.general.summary':
            madcoders_gift_card_total:
                template: '@MadcodersSyliusGiftCardPlugin/shop/cart/summary/gift_card_total.html.twig'
                # Below the order total (100), so "you pay" reads after the total it modifies.
                priority: 50

        # The same split wherever Sylius shows an order's totals to a customer.
        #
        # `sylius_shop.shared.order.show.summary.table_summary` is the prefix the checkout summary
        # page and the account order page both merge in, so one hookable covers both. The checkout
        # sidebar on the addressing, shipping and payment steps is a separate table with the same
        # row shape, so it reuses the same template.
        #
        # Priority -100 in each puts these lines below the order total they qualify.
        'sylius_shop.shared.order.show.summary.table_summary':
            madcoders_gift_card_total:
                template: '@MadcodersSyliusGiftCardPlugin/shop/order/summary/gift_card_total.html.twig'
                priority: -100

        'sylius_shop.checkout.common.sidebar.summary.total':
            madcoders_gift_card_total:
                template: '@MadcodersSyliusGiftCardPlugin/shop/order/summary/gift_card_total.html.twig'
                priority: -100

        # The apply/remove panel in the checkout sidebar, under the totals it changes.
        #
        # `sylius_shop.checkout.common.sidebar.summary` is shared by every checkout step, so one
        # hookable covers all of them; the template works out which step it is on so the customer is
        # sent back there. The sidebar is a separate hook region from the step's own form, so this
        # form is not nested inside another.
        'sylius_shop.checkout.common.sidebar.summary':
            madcoders_gift_card_panel:
                template: '@MadcodersSyliusGiftCardPlugin/shop/checkout/gift_card.html.twig'
                # Below the totals table (0), so the field reads under the amount it changes.
                priority: -100

        # The summary step overrides the sidebar block entirely, so the hookable above never reaches
        # it. It needs its own - and it is the page that matters most, being the last screen before
        # the customer pays.
        #
        # Attached to `content`, NOT to `content.form`: that hookable renders inside Sylius'
        # `form_start()`, and a form nested in another form is ignored by the browser - pressing
        # apply would submit the checkout instead. Priority 50 puts the panel below the flashes
        # (100) and directly above the order summary (0).
        'sylius_shop.checkout.complete.content':
            madcoders_gift_card_panel:
                template: '@MadcodersSyliusGiftCardPlugin/shop/checkout/gift_card.html.twig'
                priority: 50

        # Account pages. The prefix is merged with `sylius_shop.account.common`, so the account
        # breadcrumbs and menu still render around this content.
        'madcoders_sylius_gift_card.account.gift_card_index.index.content.main':
            gift_cards:
                template: '@MadcodersSyliusGiftCardPlugin/shop/account/gift_card/index/main.html.twig'
                priority: 0

        'madcoders_sylius_gift_card.account.gift_card_show.index.content.main':
            gift_card:
                template: '@MadcodersSyliusGiftCardPlugin/shop/account/gift_card/show/main.html.twig'
                priority: 0
