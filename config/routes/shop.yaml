# Shop routes contributed by the plugin. Imported by the host application under the localised shop
# route prefix (see docs/INSTALLATION.md).

madcoders_sylius_gift_card_shop_cart_apply:
    path: /gift-cards/apply
    methods: [POST]
    defaults:
        _controller: Madcoders\SyliusGiftCardPlugin\Controller\Shop\GiftCardCartController::applyAction

# POST only: removing a card mutates the cart, so it must not be reachable by a link a browser
# prefetcher, link scanner or a third-party page can follow.
madcoders_sylius_gift_card_shop_cart_remove:
    path: /gift-cards/{code}/remove
    methods: [POST]
    defaults:
        _controller: Madcoders\SyliusGiftCardPlugin\Controller\Shop\GiftCardCartController::removeAction
    requirements:
        code: .+

# Account pages. Sylius' security config protects `%sylius.security.shop_regex%/account`, so these
# are behind ROLE_USER without the plugin configuring anything.
madcoders_sylius_gift_card_shop_account_index:
    path: /account/gift-cards
    methods: [GET]
    defaults:
        _controller: Madcoders\SyliusGiftCardPlugin\Controller\Shop\AccountGiftCardController::indexAction

madcoders_sylius_gift_card_shop_account_show:
    path: /account/gift-cards/{id}
    methods: [GET]
    defaults:
        _controller: Madcoders\SyliusGiftCardPlugin\Controller\Shop\AccountGiftCardController::showAction
    requirements:
        id: \d+
