sylius_grid:
    grids:
        madcoders_sylius_gift_card_admin_gift_card_configuration:
            driver:
                name: doctrine/orm
                options:
                    class: "%madcoders_sylius_gift_card.model.gift_card_configuration.class%"
            fields:
                channel:
                    type: twig
                    label: sylius.ui.channel
                    options:
                        template: "@SyliusAdmin/shared/grid/field/channel.html.twig"
                codePrefix:
                    type: string
                    label: madcoders_sylius_gift_card.ui.code_prefix
                codeLength:
                    type: string
                    label: madcoders_sylius_gift_card.ui.code_length
                validityPeriod:
                    type: string
                    label: madcoders_sylius_gift_card.ui.validity_period
                enabled:
                    type: twig
                    label: sylius.ui.enabled
                    options:
                        template: "@SyliusAdmin/shared/grid/field/boolean.html.twig"
            filters:
                channel:
                    type: entity
                    label: sylius.ui.channel
                    form_options:
                        class: "%sylius.model.channel.class%"
            actions:
                main:
                    create:
                        type: create
                item:
                    update:
                        type: update
                    delete:
                        type: delete
