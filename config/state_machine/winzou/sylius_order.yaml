# winzou_state_machine adapter wiring.
#
# Sylius 2.x ships two state machine adapters and the host application picks one. These callbacks
# and the Symfony Workflow listeners in config/services/listeners.xml call the *same* service, so
# gift card balances behave identically whichever adapter is in use. See
# docs/adr-log/0004-gift-card-redemption-as-order-adjustment.md.
winzou_state_machine:
    sylius_order:
        callbacks:
            after:
                madcoders_gift_card_debit:
                    on: ["create"]
                    do: ["@madcoders_sylius_gift_card.modifier.order_gift_card_amount", "debit"]
                    args: ["object"]
                madcoders_gift_card_credit:
                    on: ["cancel"]
                    do: ["@madcoders_sylius_gift_card.modifier.order_gift_card_amount", "credit"]
                    args: ["object"]
                madcoders_gift_card_disable_bought:
                    on: ["cancel"]
                    do: ["@madcoders_sylius_gift_card.operator.order_gift_card", "disable"]
                    args: ["object"]
