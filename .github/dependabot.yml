version: 2
updates:
    -   package-ecosystem: composer
        directory: "/"
        schedule:
            interval: weekly
            day: monday
            time: "07:00"
        open-pull-requests-limit: 10
        commit-message:
            prefix: "build(deps)"

    -   package-ecosystem: github-actions
        directory: "/"
        schedule:
            interval: weekly
            day: monday
            time: "07:00"
        open-pull-requests-limit: 5
        commit-message:
            prefix: "ci(deps)"
