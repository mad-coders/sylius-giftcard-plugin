name: CI

# Continuous integration for the Sylius gift card plugin.
#
# The `static` job mirrors the local fast quality gate (`make verify`): composer validation,
# PHPStan, ECS and the unit tests, none of which need a database. The `tests` job builds a real
# Sylius test application - across the supported Sylius/Symfony/database combinations - and runs
# the container lint, the non-unit PHPUnit suites and Behat against it.
#
# Decision recorded in docs/adr-log/0007-github-actions-ci.md.

on:
    # Only the long-lived version branches build on push; everything else is covered by the
    # pull_request trigger. Listing every branch here as well would run the whole matrix twice for
    # each push to a branch that has an open pull request.
    push:
        branches:
            - '1.*'
        paths-ignore:
            - "*.md"
            - "docs/**"
            - "ai/**"
    pull_request:
        paths-ignore:
            - "*.md"
            - "docs/**"
            - "ai/**"
    release:
        types: [created]
    schedule:
        - cron: "0 1 * * 6" # Run at 1am every Saturday
    workflow_dispatch: ~

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    static:
        name: "Static analysis, code style & unit tests"
        runs-on: ubuntu-latest

        steps:
            -   uses: actions/checkout@v7

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: "8.3"
                    extensions: intl, gd, opcache, pdo_mysql
                    tools: composer:v2
                    coverage: none

            -   name: Get Composer cache directory
                id: composer-cache
                run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            -   name: Cache Composer dependencies
                uses: actions/cache@v6
                with:
                    path: ${{ steps.composer-cache.outputs.dir }}
                    key: composer-static-${{ hashFiles('composer.json') }}
                    restore-keys: composer-static-

            -   name: Validate composer.json
                run: composer validate --ansi --strict

            -   name: Install dependencies
                run: composer update --no-interaction --no-progress --prefer-dist

            -   name: PHPStan
                run: vendor/bin/phpstan analyse -c phpstan.neon --no-progress

            -   name: ECS
                run: vendor/bin/ecs check --no-progress-bar

            -   name: Rector (dry-run)
                run: vendor/bin/rector process --dry-run --no-progress-bar

            -   name: Unit tests
                run: vendor/bin/phpunit --colors=always --testsuite=unit

    tests:
        name: "Sylius ${{ matrix.sylius }}, PHP ${{ matrix.php }}, Symfony ${{ matrix.symfony }}, ${{ matrix.database }}"
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                php: ["8.3"]
                symfony: ["^6.4", "^7.4"]
                sylius: ["~2.0.0", "~2.1.0", "~2.2.0"]
                database: ["mysql:8.4"]
                node: ["22.x"]

                exclude:
                    -   sylius: "~2.0.0"
                        symfony: "^7.4"

                include:
                    -   php: "8.3"
                        symfony: "^7.4"
                        sylius: "~2.2.0"
                        database: "mariadb:11.4"
                        node: "22.x"
                    -   php: "8.3"
                        symfony: "^7.4"
                        sylius: "~2.2.0"
                        database: "postgres:16"
                        node: "22.x"

        env:
            APP_ENV: test

        steps:
            -   uses: actions/checkout@v7

            -   name: Build Sylius Test Application
                uses: SyliusLabs/BuildTestAppAction@v4
                with:
                    e2e_js: "yes"
                    cache_key: "${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('**/composer.json') }}"
                    cache_restore_key: "${{ runner.os }}-php-${{ matrix.php }}-composer-"
                    database: "${{ matrix.database }}"
                    node_version: "${{ matrix.node }}"
                    php_version: "${{ matrix.php }}"
                    sylius_version: "${{ matrix.sylius }}"
                    symfony_version: "${{ matrix.symfony }}"

            -   name: Validate the service container
                # Building the full Sylius container exceeds the default CLI memory_limit.
                run: php -d memory_limit=-1 vendor/bin/console lint:container

            -   name: Run non-unit PHPUnit tests
                run: vendor/bin/phpunit --colors=always --testsuite=non-unit

            -   name: Run Behat
                run: vendor/bin/behat --colors --strict -vvv --no-interaction -f progress || vendor/bin/behat --colors --strict -vvv --no-interaction -f progress --rerun

            -   name: Upload Behat logs
                uses: actions/upload-artifact@v4
                if: failure()
                with:
                    name: "Behat logs - Sylius ${{ matrix.sylius }} - PHP ${{ matrix.php }} - ${{ matrix.database }} - ${{ github.run_id }}"
                    path: etc/build/
                    if-no-files-found: ignore
                    compression-level: 6
                    overwrite: true
